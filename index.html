<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distant Worlds</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 15px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
        background: linear-gradient(transparent, #0008); }
  h1 { margin: 0 auto 0 0; font-weight: 300; letter-spacing: .15em; text-transform: uppercase; font-size: 18px; }
  small { display: block; opacity: .6; letter-spacing: 0; text-transform: none; font-size: 12px; }
  button { background: #fff1; color: inherit; border: 1px solid #fff4; border-radius: 999px; padding: 8px 16px; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
  button:hover, button:focus-visible { background: #fff3; }
  .badge { font-size: 11px; letter-spacing: .1em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; vertical-align: middle; margin-left: 8px; }
  .comune { color: #bbb; } .raro { color: #6cf; } .epico { color: #d9f; } .leggendario { color: #fc5; text-shadow: 0 0 8px #fc58; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #000c; border: 1px solid #fff3; border-radius: 12px;
           padding: 10px 16px; max-width: calc(100% - 32px); box-sizing: border-box; transition: opacity .5s; opacity: 0; pointer-events: none; }
  dialog { background: #0b0b12ee; color: inherit; border: 1px solid #fff3; border-radius: 16px; width: min(600px, calc(100% - 32px)); max-height: 85vh; padding: 20px; box-sizing: border-box; }
  dialog::backdrop { background: #0006; }
  dialog h2, dialog h3 { font-weight: 400; margin: 18px 0 8px; } dialog h2 { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: #fff1; } .chip.no { opacity: .35; }
  dialog ul { list-style: none; padding: 0; margin: 0; } dialog li { padding: 4px 0; }
  dialog a { color: inherit; } dialog .x { padding: 0 8px; margin-left: 6px; font-size: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<canvas id="c" aria-label="Paesaggio del mondo generato"></canvas>
<div class="ui">
  <h1><span id="name">…</span><span id="rarity" class="badge"></span><small><span id="meta"></span> · <span id="pos"></span></small></h1>
  <button id="walk" aria-pressed="false">🚶 Cammina</button>
  <button id="sound" aria-pressed="false">▶ Suono</button>
  <button id="fav">☆ Salva</button>
  <button id="share">Condividi</button>
  <button id="atlasBtn">Atlante</button>
  <button id="day">Mondo del giorno</button>
  <button id="gen">Genera mondo</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="atlas"><div class="row"><h2>Atlante</h2><button id="close">Chiudi</button></div><div id="atlasBody"></div></dialog>
<script type="module">
import { makeWorld, randomSeed, rng, chunk, height, walkerAt } from './world.js';
import { drawThing, drawCreature } from './draw.js';
import { ENTRIES, COMBOS, ACHIEVEMENTS, emptyState, visit, findRelic, mission, matches, checkMission, isoDay, dailySeed } from './atlas.js';

// Progress lives only in this browser; the page still works if storage is blocked.
const KEY = 'distant-worlds';
let st;
try { st = { ...emptyState(), ...JSON.parse(localStorage.getItem(KEY)) }; } catch { st = emptyState(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };
const LABEL = { era: 'epoca', civ: 'civiltà', flora: 'flora', fauna: 'fauna', style: 'stile', notte: 'notte', anelli: 'anelli', mare: 'mare', 'rarità': 'rarità' };
const days = () => { const d = new Date(); const y = new Date(d); y.setDate(d.getDate() - 1); return [isoDay(d), isoDay(y)]; };

let toastTimer;
function toast(lines) {
  if (!lines.length) return;
  const el = document.getElementById('toast');
  el.innerHTML = lines.join('<br>'); el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.style.opacity = 0), 3500);
}
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);

const cv = document.getElementById('c'), g = cv.getContext('2d');
let world, stars = [], ships = [];
// Camera position in screen widths (of the nearest layer); hash is "#seed" or "#seed@pos".
let cam = 0, vel = 0, walking = false, keys = 0, cache = new Map();

function load() {
  const [seedPart, pos] = decodeURIComponent(location.hash.slice(1)).split('@');
  const seed = seedPart || randomSeed();
  if (!location.hash) history.replaceState(null, '', '#' + seed);
  cam = Number(pos) || 0; cache = new Map();
  world = makeWorld(seed);
  const r = rng(world.music.noteSeed ^ 0x5eed);
  stars = Array.from({ length: world.stars }, () => [r(), r() * 0.7, r() * 1.5 + 0.3, r() * 6]);
  ships = Array.from({ length: world.ships }, () => [r(), 0.08 + r() * 0.3, (r() - 0.5) / 3e4, 0.004 + r() * 0.008]);
  const W = world;
  document.getElementById('name').textContent = W.name;
  const rb = document.getElementById('rarity');
  rb.textContent = W.rarity; rb.className = 'badge ' + W.rarity;
  document.getElementById('meta').textContent = `#${seed} · ${W.era} · ${W.civ} · ${W.flora} · ${W.fauna} · ${W.style} · ${W.music.scaleName} ${W.music.bpm} bpm`;
  updateFav();

  if (st.last !== seed) {
    st.last = seed;
    const news = visit(st, W), [today, yesterday] = days(), msg = [];
    if (news.entries.length) msg.push('Nuova scoperta: ' + news.entries.map((e) => e.split(':')[1] === 'true' ? e.split(':')[0] : e.split(':')[1]).join(', '));
    if (checkMission(st, W, today, yesterday)) msg.push(`✓ Missione del giorno compiuta! Serie: ${st.daily.streak} giorni`);
    for (const c of news.combos) msg.push('Nuova combinazione: ' + c.replace('@', ' · '));
    for (const a of news.achievements) msg.push(`🏆 Traguardo: ${a}`);
    if (W.rarity !== 'comune') msg.unshift(`Mondo ${W.rarity}!`);
    save(); toast(msg);
  }
  document.title = `${world.name} — Distant Worlds`;
  if (audio) { stopAudio(); startAudio(); }
}

let last = 0;
function draw(t) {
  cam += (keys * 0.3 + (walking ? 0.05 : 0)) * Math.min(t - last, 100) / 1000; last = t;
  document.getElementById('pos').textContent = `📍 ${cam.toFixed(1)}`;
  const w = cv.width = innerWidth * devicePixelRatio, h = cv.height = innerHeight * devicePixelRatio;
  const W = world, sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, W.sky.top); sky.addColorStop(1, W.sky.bottom);
  g.fillStyle = sky; g.fillRect(0, 0, w, h);

  for (const [x, y, s, p] of stars) {
    g.globalAlpha = 0.5 + 0.5 * Math.sin(t / 900 + p);
    g.fillStyle = '#fff'; g.fillRect(x * w, y * h, s * devicePixelRatio, s * devicePixelRatio);
  }
  g.globalAlpha = 1;

  const m = Math.min(w, h), S = W.sun;
  const glow = g.createRadialGradient(S.x * w, S.y * h, 0, S.x * w, S.y * h, S.size * m * 4);
  glow.addColorStop(0, S.color); glow.addColorStop(0.25, S.color); glow.addColorStop(1, 'transparent');
  g.fillStyle = glow; g.beginPath(); g.arc(S.x * w, S.y * h, S.size * m * 4, 0, 7); g.fill();
  if (W.rings) {
    g.strokeStyle = S.color; g.globalAlpha = 0.5; g.lineWidth = m * 0.004;
    g.beginPath(); g.ellipse(S.x * w, S.y * h, S.size * m * 2.2, S.size * m * 0.5, -0.3, 0, 7); g.stroke(); g.globalAlpha = 1;
  }
  g.fillStyle = '#ddd';
  for (const o of W.moons) {
    const x = ((o.x + t / 4e5) % 1) * w;
    g.beginPath(); g.arc(x, o.y * h, o.size * m, 0, 7); g.fill();
  }

  for (const [x0, y, v, s] of ships) {
    const x = (((x0 + t * v) % 1) + 1) % 1 * w;
    g.fillStyle = '#ccc'; g.beginPath(); g.ellipse(x, y * h, s * m, s * m * 0.25, 0, 0, 7); g.fill();
    g.fillStyle = W.accent; g.fillRect(x - 1, y * h + s * m * 0.2, 2 * devicePixelRatio, 2 * devicePixelRatio);
  }

  // Flyers wrap over 1.2 screen widths so they leave the frame before reappearing.
  const wrap = (c) => ((((c.x - cam * 0.05 + t * c.speed) % 1) + 1) % 1) * 1.2 - 0.1;
  const co = { accent: W.accent, style: W.style, lights: W.lights, t,
    bird: W.night ? '#fff8' : '#0009', whale: W.layers[0].color };
  for (const c of W.flyers) drawCreature(g, c, wrap(c) * w, (c.y ?? 0.2) * h, c.size * m, co);

  const light = W.style === 'mono' ? '#fff' : W.style === 'neon' ? W.accent : '#ffd27a';
  const next = new Map(), step = 4 * devicePixelRatio;
  W.layers.forEach((L, i) => {
    const off = cam * L.parallax, X = (x) => (x - off) * w, Y = (x) => (L.base - height(L, x) * L.span) * h;
    g.fillStyle = L.color; g.beginPath(); g.moveTo(0, h);
    for (let sx = -step; sx < w + step; sx += step) g.lineTo(sx, Y(off + sx / w));
    g.lineTo(w, h); g.fill();
    if (W.style === 'neon') { g.save(); g.strokeStyle = g.shadowColor = W.accent; g.shadowBlur = 10; g.lineWidth = devicePixelRatio; g.stroke(); g.restore(); }
    const o = { color: L.color, accent: W.accent, light, night: W.night, lights: W.lights, style: W.style, t };
    // Only chunks near the screen exist; the rest are rebuilt identically on return.
    for (let c = Math.floor(off - 0.5); c <= Math.floor(off + 1.5); c++) {
      const key = i + ':' + c, ch = cache.get(key) ?? chunk(W, i, c);
      next.set(key, ch);
      // Sink things slightly into the ground so slopes don't leave them floating.
      for (const th of ch.things) {
        drawThing(g, th, X(th.x), Y(th.x) + th.size * m * 0.1, th.size * m, o);
        if (th.relic && X(th.x) > 0 && X(th.x) < w) relic(th.kind);
      }
      for (const cr of ch.creatures) {
        const [x, dir] = walkerAt(cr, t);
        drawCreature(g, { ...cr, speed: dir }, X(x), Y(x) + cr.size * m * 0.05, cr.size * m, { ...co, color: L.color });
      }
    }
    if (W.water && i === 0) {
      g.fillStyle = W.water; g.fillRect(0, h * 0.62, w, h);
      g.fillStyle = '#fff2';
      for (let y = h * 0.63; y < h; y += 6 * devicePixelRatio)
        g.fillRect(S.x * w - m * S.size * (1 + Math.sin(y + t / 400)), y, m * S.size * 2, devicePixelRatio);
    }
  });
  cache = next;
  requestAnimationFrame(draw);
}

function relic(kind) {
  const news = findRelic(st, kind);
  if (!news.entries.length) return;
  save(); toast([`Reperto trovato: ${kind}!`, ...news.achievements.map((a) => `🏆 Traguardo: ${a}`)]);
}

// Travel: arrow keys / A-D, drag on the landscape, or the walk toggle.
const held = new Set();
const keyDir = { ArrowLeft: -1, KeyA: -1, ArrowRight: 1, KeyD: 1 };
addEventListener('keydown', (e) => { if (e.code in keyDir && !e.target.closest?.('dialog')) { held.add(e.code); keys = [...held].reduce((a, k) => a + keyDir[k], 0); } });
addEventListener('keyup', (e) => { held.delete(e.code); keys = [...held].reduce((a, k) => a + keyDir[k], 0); });
let dragX = null;
cv.addEventListener('pointerdown', (e) => { dragX = e.clientX; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', (e) => { if (dragX === null) return; cam -= (e.clientX - dragX) / innerWidth; dragX = e.clientX; });
cv.addEventListener('pointerup', () => (dragX = null));
const walkBtn = document.getElementById('walk');
walkBtn.onclick = () => { walking = !walking; walkBtn.textContent = walking ? '■ Fermati' : '🚶 Cammina'; walkBtn.setAttribute('aria-pressed', walking); };

// Generative ambient: drone on root+fifth, sparse seeded melody through a delay.
let audio = null;
function startAudio() {
  const M = world.music, ac = new AudioContext(), out = ac.createGain();
  out.gain.setValueAtTime(0, ac.currentTime); out.gain.linearRampToValueAtTime(0.5, ac.currentTime + 3);
  const lp = ac.createBiquadFilter(); lp.frequency.value = M.cutoff; lp.connect(out); out.connect(ac.destination);
  const delay = ac.createDelay(), fb = ac.createGain();
  delay.delayTime.value = 60 / M.bpm * 0.75; fb.gain.value = 0.45;
  delay.connect(fb); fb.connect(delay); delay.connect(lp);
  const hz = (midi) => 440 * 2 ** ((midi - 69) / 12);

  for (const [semi, det] of [[0, -4], [7, 4], [12, 0]]) {
    const o = ac.createOscillator(), gg = ac.createGain();
    o.type = 'sine'; o.frequency.value = hz(M.root + semi); o.detune.value = det; gg.gain.value = 0.12;
    o.connect(gg); gg.connect(lp); o.start();
  }

  const r = rng(M.noteSeed), beat = 60 / M.bpm / 2;
  let next = ac.currentTime + 1;
  const tick = () => {
    while (next < ac.currentTime + 0.5) {
      if (r() < M.density) {
        const deg = Math.floor(r() * M.scale.length), oct = 24 + 12 * Math.floor(r() * 2);
        const o = ac.createOscillator(), e = ac.createGain();
        o.type = M.wave; o.frequency.value = hz(M.root + oct + M.scale[deg]);
        if (M.microtonal) o.detune.value = (r() - 0.5) * 60;
        e.gain.setValueAtTime(0, next); e.gain.linearRampToValueAtTime(0.15, next + 0.02);
        e.gain.exponentialRampToValueAtTime(0.001, next + beat * 3);
        o.connect(e); e.connect(lp); e.connect(delay); o.start(next); o.stop(next + beat * 3);
      }
      next += beat;
    }
  };
  audio = { ac, timer: setInterval(tick, 100) };
  setBtn(true);
}
function stopAudio() { clearInterval(audio.timer); audio.ac.close(); audio = null; setBtn(false); }
const sb = document.getElementById('sound');
function setBtn(on) { sb.textContent = on ? '■ Silenzio' : '▶ Suono'; sb.setAttribute('aria-pressed', on); }

sb.onclick = () => (audio ? stopAudio() : startAudio());
document.getElementById('gen').onclick = () => { location.hash = randomSeed(); };
document.getElementById('share').onclick = async (e) => {
  // Link to the exact spot the traveller is standing on.
  const url = location.href.split('#')[0] + '#' + encodeURIComponent(world.seed) + (Math.abs(cam) >= 0.05 ? '@' + cam.toFixed(1) : '');
  try { await navigator.clipboard.writeText(url); e.target.textContent = 'Link copiato'; }
  catch { prompt('Copia il link:', url); }
  setTimeout(() => (e.target.textContent = 'Condividi'), 1500);
};
const favBtn = document.getElementById('fav');
function updateFav() { favBtn.textContent = st.favs.some((f) => f.seed === world.seed) ? '★ Salvato' : '☆ Salva'; }
favBtn.onclick = () => {
  const i = st.favs.findIndex((f) => f.seed === world.seed);
  if (i >= 0) st.favs.splice(i, 1);
  else {
    const name = prompt('Dai un nome a questo mondo:', world.name);
    if (name === null) return;
    st.favs.unshift({ seed: world.seed, name: name.trim() || world.name, rarity: world.rarity });
  }
  save(); updateFav();
};
document.getElementById('day').onclick = () => { location.hash = dailySeed(days()[0]); };

const dlg = document.getElementById('atlas');
document.getElementById('close').onclick = () => dlg.close();
document.getElementById('atlasBtn').onclick = () => {
  const [today] = days(), m = mission(today), done = st.daily.done === today;
  const groups = Object.groupBy(ENTRIES, (e) => e.split(':')[0]);
  document.getElementById('atlasBody').innerHTML = `
    <p>Scoperte ${st.seen.filter((e) => ENTRIES.includes(e)).length + st.combos.length}/${ENTRIES.length + COMBOS.length} · Mondi esplorati ${st.count}</p>
    ${Object.entries(groups).map(([k, es]) => `<div>${LABEL[k]}</div><div class="chips">${es.map((e) => {
      const ok = st.seen.includes(e), v = e.split(':')[1] === 'true' ? 'sì' : e.split(':')[1];
      return `<span class="chip ${ok ? (k === 'rarità' ? v : '') : 'no'}">${ok ? esc(v) : '???'}</span>`; }).join('')}</div>`).join('')}
    <h3>Civiltà nel tempo <small>${st.combos.length}/${COMBOS.length}</small></h3>
    ${Object.entries(Object.groupBy(COMBOS, (c) => c.split('@')[0])).map(([civ, cs]) => `<div>${civ}</div><div class="chips">${cs.map((c) =>
      `<span class="chip ${st.combos.includes(c) ? '' : 'no'}">${st.combos.includes(c) ? esc(c.split('@')[1]) : '???'}</span>`).join('')}</div>`).join('')}
    <h3>Missione del giorno</h3>
    <p>${done ? '✓' : '○'} Trova un mondo con ${m.map(([k, v]) => `<b>${LABEL[k]}: ${esc(v)}</b>`).join(' e ')}.
      <br><small>Serie attuale ${st.daily.streak} · migliore ${st.daily.best}${matches(world, m) && done ? ' · questo mondo la soddisfa' : ''}</small></p>
    <h3>Traguardi</h3>
    <ul>${ACHIEVEMENTS.map(([n, d, ok]) => `<li>${ok(st) ? '🏆' : '🔒'} <b>${n}</b> — ${d}</li>`).join('')}</ul>
    <h3>Diario di bordo</h3>
    ${st.favs.length ? `<ul>${st.favs.map((f, i) => `<li><a href="#${encodeURIComponent(f.seed)}">${esc(f.name)}</a>
      <span class="badge ${f.rarity}">${f.rarity}</span><button class="x" data-i="${i}" aria-label="Rimuovi ${esc(f.name)}">✕</button></li>`).join('')}</ul>`
      : '<p><small>Nessun mondo salvato. Usa ☆ Salva.</small></p>'}`;
  dlg.querySelectorAll('.x').forEach((b) => (b.onclick = () => { st.favs.splice(+b.dataset.i, 1); save(); updateFav(); dlg.close(); document.getElementById('atlasBtn').click(); }));
  dlg.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => dlg.close()));
  dlg.showModal();
};

addEventListener('hashchange', load);
load();
requestAnimationFrame(draw);
</script>
</body>
</html>
